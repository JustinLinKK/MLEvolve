# MLEvolve unified configuration template.
# Copy this file to config.yaml for local machine settings and API keys.
# config.yaml is ignored by git; keep this example sanitized.

data_dir: null
dataset_dir: ''
desc_file: null
goal: null
eval: null
exp_name: null
exp_id: ''
log_dir: ./runs
log_level: INFO
workspace_dir: ./runs
# Optional path to a stopped run's logs/journal.json. Reuses its workspace,
# logs, scheduler state, and completed tree nodes.
resume_journal: null
preprocess_data: true
copy_data: false
experiment:
  mode: hardware_aware
start_cpu_id: 0
cpu_number: 21
monitor:
  enabled: true
  interval_seconds: 5
  gpu_idle_util_threshold: 10
  gpu_idle_memory_threshold_mb: 1024
  cpu_idle_util_threshold: 20
  adaptive_compression: true
  max_csv_rows: 1000
  compress_to_rows: 500
torch_hub_dir: ''
pretrain_model_dir: ''
exec:
  timeout: null
  agent_file_name: runfile.py
context_cache:
  # Global kill switch. When false, existing providers retain the uncached request path.
  enabled: true
  local_pack_cache_enabled: true
  provider_prompt_cache_enabled: true
  provider_prompt_cache_roles: []
  provider_prompt_cache_models: []
  cache_dir: var/context-cache
  policy: auto
  ttl: null
  # The first real request warms a cache family; no synthetic request is sent.
  prewarm: true
  telemetry: true
  verify_prefix: false
  capture_prompts: false
  shadow: false
  knowledge_version: k1
  openrouter_sticky_routing: true
  openrouter_routing_shards: 1
  openrouter_upstream: null
  openrouter_allow_fallbacks: true
  max_pack_bytes: 16777216
vllm_client:
  cache_salt_env: MLEVOLVE_VLLM_CACHE_SALT
  require_cache_salt: true
  session_affinity: true
hardware_knowledge:
  enabled: true
  include_profile_evidence: true
  probe_timeout_seconds: 10
  settings:
    runtime_root: ./hardware_knowledge_graph/runtime
    graph:
      enabled: true
      provider: neo4j
      uri: bolt://127.0.0.1:7688
      username: neo4j
      password_env: HARDWARE_KNOWLEDGE_NEO4J_PASSWORD
      database: neo4j
    redis_cache:
      enabled: false
      url: redis://127.0.0.1:6379/0
      url_env: LOCALML_HARDWARE_KNOWLEDGE_REDIS_URL
      key_prefix: localml_hardware_knowledge
      ttl_seconds: 300
      max_entries: 4096
      socket_timeout_seconds: 0.2
      cache_graph_queries: true
scheduler:
  enabled: true
  runtime_root: null
  start_service: true
  wait_poll_interval_seconds: 1
  wait_timeout_seconds: null
  preload_source_model_id: null
  preload_source_model_path: null
  preload_source_loader_target: null
  settings:
    runtime_root: ./localml_scheduler/runtime
    scheduler_poll_interval_seconds: 0.2
    command_poll_limit: 100
    aging_interval_seconds: 120
    aging_priority_increment: 1
    enable_priority_aging: true
    preempt_check_interval_seconds: 0.2
    baseline_cache:
      warm_queue_policy: budget_only
      warm_queue_top_k: 0
      entry_capacity: 0
      max_ram_percent: 0
      memory_budget_bytes: 0
    cache_server_host: 127.0.0.1
    cache_server_port: 8765
    cache_socket_name: cache_server.sock
    auto_resume_recoverable: false
    log_db:
      provider: postgres
      # Set LOCALML_SCHEDULER_LOG_DSN to a psycopg-compatible DSN, for example:
      # postgresql://scheduler:password@localhost:5432/scheduler
      dsn_env: LOCALML_SCHEDULER_LOG_DSN
      schema: scheduler_logs
      enabled: false
    prediction:
      mode: branch_profile
      ml:
        registry_path: null
        source_conversion_timeout_seconds: 15
        cache_size: 1024
        test_override_enabled: false
        test_model_path: null
    # Evaluated at epoch safe points. Scheduler-aware example runners emit
    # `loss`; use `val_loss` instead when the runner reports validation loss.
    early_stopping:
      enabled: true
      metric_name: loss
      mode: min
      patience_epochs: 5
      min_delta: 0.001
      min_epochs: 10
      save_best_checkpoint: true
      # Generic runners must explicitly restore the protected best checkpoint.
      restore_best_checkpoint: false
      missing_metric_policy: ignore
    gpu_scheduler:
      enabled: true
      # Sole production policy: start one anchor, try one newcomer, and retain
      # the addition only when verified drain-time gain passes colocation.min_gain.
      # VRAM is a hard admission constraint, never a placement score.
      mode: parallel_time_aware
      # baseline preserves the established SRT/newcomer order. backend_awared
      # enables deterministic source-derived backend risk and Pareto trial ranking.
      scheduler_decision_mode: baseline
      # One authoritative packed mode. mps_process means independent CUDA
      # job processes connected to the scheduler-owned NVIDIA MPS service.
      packing_backend: mps_process
      exclusive_fallback_enabled: true
      mps_unavailable_policy: exclusive
      # null allows incremental admission to continue while evidence and memory permit.
      parallel_job_cap: null
      priority_window_size: 8
      oldest_window_size: 4
      starvation_timeout_seconds: 1800
      device_index: 0
      fallback_cooldown_seconds: 900
      batch_probe_enabled: true
      batch_probe_target_memory_fraction: 0.97
      batch_probe_max_batch_size: null
      profiling:
        warmup_steps: 30
        solo_probe_steps: 80
        pair_probe_steps: 60
        reuse_profile_if_confidence_ge: 0.8
      colocation:
        min_gain: 1.0
        trial_epochs: 2
        decision_replay:
          enabled: true
          min_stable_observations: 3
          training_time_change_fraction: 0.25
          vram_change_fraction: 0.25
      memory:
        gpu_vram_gib: null
        # Prediction admission ceiling; this is not optimized or maximized.
        predicted_budget_fraction: 0.85
        live_admission_stop_fraction: 0.9
        live_admission_resume_fraction: 0.85
        admission_average_window_seconds: 10
      telemetry:
        device_poll_ms: 500
        pair_recheck_every_steps: 20
      objective:
        priority_weight: 0.1
        objective_version: time_v6_verified_piecewise_drain
      batch_options:
        exponent_offsets: [-2, -1, 0, 1, 2]
        require_power_of_two_original: true
      source_trial_ranking:
        schema_version: 2
        policy: pareto
        ready_window_size: 10
        max_group_size: 2
        amortization_factor: 3.0
        estimated_setup_seconds: 0.0
        require_live_trial_for_unknown: true
        source_analysis:
          cache_enabled: true
          max_source_bytes: 2000000
          max_unknown_operator_fraction_for_high_confidence: 0.05
          max_unknown_operator_fraction_for_medium_confidence: 0.25
          # Set these from versioned hardware data to enable roofline ratios.
          # Values are intentionally absent rather than guessed.
          peak_tflops_by_dtype: {}
          memory_bandwidth_gbps: null
        # Conservative additions on top of the existing 15% admission reserve.
        mode_overhead_mb:
          cuda_process: 512
          mps_process: 384
        mps_allocation_templates: [[50, 50], [60, 40], [40, 60]]
      submission_defaults:
        requires_gpu: true
        estimated_vram_mb: null
        estimated_avg_vram_mb: null
        estimated_ram_mb: null
        packing_eligible: false
        packing_family: mlevolve_script
        packing_max_slowdown_ratio: null
        backend_allowlist: [mps_process]
        batch_probe_enabled: true
        batch_probe_model_key: null
        runtime_probe_enabled: true
        runtime_probe_target: null
        runtime_probe_model_key: null
        runtime_probe_strategy: epoch_1
      mps:
        enabled: true
        compute_mode: EXCLUSIVE_PROCESS
        default_primary_active_thread_pct: 60
        default_secondary_active_thread_pct: 40
        default_omp_num_threads: 6
        default_mkl_num_threads: 6
        pipe_directory: /tmp/nvidia-mps
        log_directory: /tmp/nvidia-mps-log
      cuda_process:
        enabled: true
        default_omp_num_threads: 6
        default_mkl_num_threads: 6
agent:
  steps: 500
  time_limit: 172800
  initial_drafts: 3
  seed: 42
  data_preview: true
  code:
    model: openai/gpt-5-nano
    temp: 1
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ''
    # To use an authenticated Claude Code subscription instead of an API key:
    # model: sonnet
    # provider: claude_cli
    # Self-hosted alternative:
    # model: qwen3.8-27b-int8-w8a16
    # provider: vllm
    # base_url: http://vllm-router-or-server:8000/v1
    # api_key: ''
  feedback:
    model: openai/gpt-5-nano
    temp: 1
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ''
  check_data_leakage: true
  use_diff_mode: true
  hardware_context_enabled: true
  pipeline_decision_enabled: true
  hardware_context_limit: 8
  hardware_context_max_prompt_chars: 3500
  precision_optimization_mode: normal
  # NVIDIA CUDA documentation enrichment is local-first and disabled by
  # default. Enable progressively: shadow -> prefetch_only -> debug_cached ->
  # debug_live. Only debug_live permits a blocking hosted lookup.
  cuda_docs:
    enabled: false
    rollout_mode: off
    endpoint: https://api.copilot.nsight.ngc.nvidia.com/mcp/cuda-docs
    # Name only; keep the bearer token in the environment, never YAML.
    auth_token_env: NVIDIA_CUDA_MCP_TOKEN
    remote_roles: [debug]
    blocking_roles: [debug]
    local_roles: [draft, improve, debug, code_review, evolution, fusion, aggregation]
    soft_timeout_seconds: 6
    hard_timeout_seconds: 8
    total_enrichment_deadline_seconds: 10
    max_remote_calls_per_action: 1
    prompt_max_chars: 2000
    prompt_max_chunks: 3
    ram_cache_max_entries: 512
    ram_cache_ttl_seconds: 21600
    positive_ttl_seconds: 604800
    stale_ttl_seconds: 2592000
    negative_ttl_seconds: 600
    transient_failure_ttl_seconds: 60
    auth_failure_ttl_seconds: 600
    ttl_jitter_fraction: 0.1
    async_prewarm: true
    prewarm_concurrency: 2
    persist_raw_chunks: true
    synthesize_recipes_async: true
    send_source_code: false
    remote_rate_per_minute: 12
    remote_burst: 2
    circuit_failure_threshold: 3
    circuit_window_seconds: 60
    circuit_cooldown_seconds: 60
    singleflight_wait_seconds: 0.25
    redis_namespace_capacity: 512
    raw_response_max_chars: 32000
    normalized_chunk_max_chars: 4000
  review:
    enabled: true
    max_repair_rounds: 2
    classifier_retries: 3
    repair_retries: 2
    reject_unresolved_critical: true
    fail_open_on_unavailable: true
    parallel_training_repairs: true
  fusion_vs_evolution_prob: 0.3
  branch_fusion_trigger_prob: 1.0
  max_fusion_drafts: 2
  use_global_memory: true
  memory_similarity_threshold: 0.7
  memory_embedding_device: cuda
  memory_embedding_model_path: BAAI/bge-base-en-v1.5
  search:
    parallel_search_num: 2
    num_gpus: 1
    num_drafts: 5
    num_bugs: 1
    num_improves: 3
    topk_max_improves: 10
    max_debug_depth: 20
    back_debug_depth: 3
    debug_prob: 1
    metric_improvement_threshold: 0.0001
    max_improve_failure: 3
    branch_stagnation_threshold: 3
    topk_stagnation_threshold: 6
    stagnation_window: 4
    top_candidates_size: 20
    explore_switch_start: 0.5
    explore_switch_end: 0.7
    min_exploration_weight: 0.2
    topk_early_k: 5
    topk_early_max_per_branch: 3
    topk_late_k: 3
    topk_late_max_per_branch: 2
    force_backprop_late_threshold: 0.8
    force_backprop_late_prob: 0.5
    force_backprop_mid_threshold: 0.4
    force_backprop_mid_modulo: 3
    recent_best_window: 4
    fusion_min_time_hours: 6
    fusion_max_time_hours: 10
    fusion_min_successful_nodes: 2
    fusion_min_branches: 2
  decay:
    exploration_constant: 1.414
    lower_bound: 0.5
    alpha: 0.01
    phase_ratios:
    - 0.3
    - 0.7
coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: ''
