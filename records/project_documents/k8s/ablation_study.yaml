apiVersion: v1
type: pods
metadata:
  name: predictor
container:
  - name: predictor-container
    image: ubuntu
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    command: ["sh", "-c", "echo 'Predictor training started just now' && sleep infinity"]
    ports:
      - containerPort: 8080
        name: http
        protocol: TCP
