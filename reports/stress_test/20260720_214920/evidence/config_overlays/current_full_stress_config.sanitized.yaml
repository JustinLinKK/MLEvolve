coldstart:
  use_coldstart: true
  task_json_path: engine/coldstart/competition_tag_classified.json
  model_json_path: engine/coldstart/models_guidance_classified.json
  description: '

    Model1: Siglip2


    Description:Siglip2 is an extended family of vision as well as multimodel foundation
    model, has superior image classification, image-text retrieval, and downstream
    vison transfer performance across all model scales.


    Model API contract (authoritative for this repository runtime):

    - Exact model id: `google/siglip2-so400m-patch16-256`

    - Runtime: transformers 4.53.0; checkpoint resolves to `siglip`

    - Load with: `AutoModel.from_pretrained("google/siglip2-so400m-patch16-256")`

    - Preferred preprocessing: `AutoProcessor.from_pretrained("google/siglip2-so400m-patch16-256")`

    - Required fixed image size: `256x256`

    - Manual normalization fallback: mean=[0.5, 0.5, 0.5], std=[0.5, 0.5, 0.5]

    - Image feature call: `image_features = model.get_image_features(pixel_values=pixel_values)`

    - Feature return: torch.Tensor with shape `[batch, 1152]`; use this value directly.

    - Do not access `.pooler_output`, `.last_hidden_state` on the feature-call result.

    - Feature dimension config path: `model.config.vision_config.hidden_size`

    - Invalid config assumptions for this checkpoint: `model.config.projection_dim`,
    `model.config.hidden_size`

    - Pre-training smoke assertion: `image_features.ndim == 2`

    - Pre-training smoke assertion: `image_features.shape[-1] == model.config.vision_config.hidden_size`


    Code template (MUST copy exactly — do NOT change model variant names or file paths):

    ```python

    from transformers import AutoProcessor, AutoModel

    MODEL_ID = "google/siglip2-so400m-patch16-256"

    processor = AutoProcessor.from_pretrained(MODEL_ID)

    model = AutoModel.from_pretrained(MODEL_ID)

    image_features = model.get_image_features(pixel_values=pixel_values)  # torch.Tensor
    [batch, 1152]; use directly

    feature_dim = model.config.vision_config.hidden_size

    ```'
