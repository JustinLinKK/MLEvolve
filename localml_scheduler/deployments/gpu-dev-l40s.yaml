apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-dev
  namespace: ecepxie
  labels:
    app: gpu-dev
spec:
  replicas: 1
  # A two-GPU pod must be the only queued replica: rolling updates otherwise
  # retain the prior Pending ReplicaSet and request four L40S GPUs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-dev
  template:
    metadata:
      labels:
        app: gpu-dev
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40S
      containers:
        - name: jupyter
          image: nvcr.io/nvidia/pytorch:26.04-py3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              /init/init.sh &
              init_pid=$!
              until pgrep -x sshd >/dev/null; do sleep 1; done
              /bootstrap/bootstrap.sh
              wait "$init_pid"
          ports:
            - containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "16"
              memory: 32Gi
              nvidia.com/gpu: "2"
          env:
            - name: ACCELERATOR
              value: l40
            - name: MODEL_CUDA_VISIBLE_DEVICES
              value: "0"
            - name: TENSOR_PARALLEL_SIZE
              value: "1"
            - name: EXPERIMENT_CUDA_VISIBLE_DEVICES
              value: "1"
          volumeMounts:
            - name: home
              mountPath: /root
            - name: init
              mountPath: /init
            - name: dshm
              mountPath: /dev/shm
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: yuw-home
        - name: init
          configMap:
            name: nautilus-init
            defaultMode: 493
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: bootstrap
          configMap:
            name: qwen38-l40s-bootstrap
            defaultMode: 493
