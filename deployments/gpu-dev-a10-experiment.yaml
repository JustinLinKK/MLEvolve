apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-dev-a10-experiment
  namespace: ecepxie
  labels:
    app: gpu-dev-a10-experiment
    purpose: petfinder-scheduler-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-dev-a10-experiment
  template:
    metadata:
      labels:
        app: gpu-dev-a10-experiment
        purpose: petfinder-scheduler-experiment
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
      containers:
        - name: petfinder-experiment
          image: nvcr.io/nvidia/pytorch:26.04-py3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              /init/init.sh &
              init_pid=$!
              until pgrep -x sshd >/dev/null; do sleep 1; done
              wait "$init_pid"
          ports:
            - containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: home
              mountPath: /root
            - name: init
              mountPath: /init
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: yuw-home
        - name: init
          configMap:
            name: nautilus-init
            defaultMode: 493
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
